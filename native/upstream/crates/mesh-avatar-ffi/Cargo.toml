[package]
name = "mesh-avatar-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
render = ["dep:mesh-avatar-wgpu", "dep:pollster", "dep:metal", "dep:foreign-types"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
mesh-avatar-core.workspace = true
mesh-avatar-wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
zip.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
metal = { version = "0.32", optional = true }
foreign-types = { version = "0.5", optional = true }
