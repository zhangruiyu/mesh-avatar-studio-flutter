name: mesh_avatar_studio
description: Flutter 原生 2D 网格角色播放器，支持 Mesh Avatar Studio 模型、表情、动作和音量驱动口型，适用于 Android、iOS、macOS 与鸿蒙。
version: 0.1.0-dev.5
repository: https://github.com/zhangruiyu/mesh-avatar-studio-flutter
issue_tracker: https://github.com/zhangruiyu/mesh-avatar-studio-flutter/issues

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.meshavatar.mesh_avatar_studio
        pluginClass: MeshAvatarStudioPlugin
      ios:
        pluginClass: MeshAvatarStudioPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MeshAvatarStudioPlugin
        sharedDarwinSource: true
      ohos:
        pluginClass: MeshAvatarStudioPlugin
